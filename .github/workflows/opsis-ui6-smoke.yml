name: Opsis.UI 6 WPF compatibility
on:
  push:
    paths:
      - 'wpf/OptimizerWpf/App.xaml'
      - 'wpf/OptimizerWpf/Themes/OpsisUI6Midnight.xaml'
      - '.github/workflows/opsis-ui6-smoke.yml'
  pull_request:
    paths:
      - 'wpf/OptimizerWpf/App.xaml'
      - 'wpf/OptimizerWpf/Themes/OpsisUI6Midnight.xaml'
      - '.github/workflows/opsis-ui6-smoke.yml'

jobs:
  xaml-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Compile GearWin WPF and new shared resource dictionary
        run: dotnet build wpf/OptimizerWpf/OptimizerWpf.csproj --configuration Release

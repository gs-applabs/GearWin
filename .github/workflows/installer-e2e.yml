name: installer-e2e

# End-to-end test of the setup on clean, FREE GitHub-hosted Windows runners (public repository: standard runners only, never larger / GPU / paid ones).
# build the setup once -> on a clean machine: install the newest published version, upgrade to the new one while it runs, check registry / Program Files /
# shortcuts, start the program (detected tier and every forced GEARWIN_FORCE_TIER), uninstall, check leftovers.
# NOT checked here (a runner cannot): the UAC prompt, SmartScreen, a real graphics card, several monitors, per-monitor DPI.

on:
  workflow_dispatch:
  push:
    branches: [main, master, release/7.0.0-validation, release/7.1.0-ultra, release/7.1.0-rc1, release/7.1.0-final]
    paths-ignore: ['docs/**', '**/*.md']

concurrency:
  group: installer-e2e-${{ github.ref }}
  # Preserve active installer acceptance evidence; supersede queued candidates only.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-setup:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - name: Test Windows desktop and migration
        shell: pwsh
        run: |
          dotnet test wpf/OptimizerWpf.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test migration/GearWin.Migration.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inno Setup (free)
        shell: pwsh
        run: ./tools/ci-install-inno.ps1
      - name: Build the setup
        shell: pwsh
        run: ./tools/build-setup-ci.ps1
      - name: Package complete source and all Markdown for code audit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          git archive --format=zip --output=dist/GearWin-7.1.0-rc1-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git archive source failed' }
          New-Item -ItemType Directory -Force -Path dist/markdown | Out-Null
          $markdownFiles = @(git ls-files -- '*.md' '*.MD')
          if ($LASTEXITCODE -ne 0 -or $markdownFiles.Count -eq 0) { throw 'No tracked Markdown files found' }
          foreach ($relative in $markdownFiles) {
            $path = Join-Path 'dist/markdown' $relative
            New-Item -ItemType Directory -Path (Split-Path -Parent $path) -Force | Out-Null
            Copy-Item -LiteralPath $relative -Destination $path
          }
          Compress-Archive -Path dist/markdown/* -DestinationPath dist/GearWin-7.1.0-rc1-markdown.zip -CompressionLevel Optimal
          @(
            'Version: 7.1.0-rc.1 candidate',
            "Git commit: $(git rev-parse HEAD)",
            'Source is from tracked Git files. No binaries or build outputs are included.',
            "Markdown count: $($markdownFiles.Count)",
            'Installer is a separate artifact from the same GitHub Actions run.'
          ) | Set-Content dist/PACKAGE_PROVENANCE.txt
          Get-FileHash -Algorithm SHA256 dist/*.zip | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)"
          } | Set-Content dist/SOURCE_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gearwin-source-7.1.0-rc1
          path: |
            dist/GearWin-7.1.0-rc1-source.zip
            dist/GearWin-7.1.0-rc1-markdown.zip
            dist/PACKAGE_PROVENANCE.txt
            dist/SOURCE_SHA256SUMS.txt
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: setup
          path: |
            installer/Output/GearWin-Setup.exe
            installer/Output/GearWin-Setup.exe.sha256
          retention-days: 7

  offline-clone-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test offline cloning safeguards and virtual disk images (no physical drives)
        run: python3 -m unittest discover -s tools/recovery/tests -v

  e2e:
    needs: build-setup
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
        scenario: [fresh, from-latest, in-app]
        include:
          - os: windows-2025
            scenario: fresh
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: setup
          path: setup
      - name: Install, upgrade, smoke test, uninstall (${{ matrix.scenario }} on ${{ matrix.os }})
        shell: pwsh
        run: ./tools/e2e-installer.ps1 -Scenario '${{ matrix.scenario }}' -NewSetup "$PWD/setup/GearWin-Setup.exe" -Repository '${{ github.repository }}' -Out "${{ runner.temp }}/e2e"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.os }}-${{ matrix.scenario }}
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
          retention-days: 7
